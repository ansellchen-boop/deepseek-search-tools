name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check lib/index.js
      - run: node --check lib/client.js
      - run: node --check lib/bridge.js
      - run: node --check lib/usage.js
      - run: node --import ./test/register-loader.mjs test/harness.mjs
